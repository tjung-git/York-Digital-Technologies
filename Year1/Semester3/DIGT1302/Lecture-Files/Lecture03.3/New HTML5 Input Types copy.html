<!DOCTYPE html>

<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>New HTML5 Input Types</title>
  </head>

  <body>
    <div>
      <h1>New HTML5 Input Types</h1>
      <p>
        This form demonstrates the new HTML5 input types and the
        <b>placeholder, required, and autofocus</b> attributes.
      </p>

      <form method="post" action="mailto:jdoe37@hotmail.com">
         <fieldset><legend>New HTML5 Input Types</legend>
            <label> Date: 
               <input type="date"> (yyyy-mm-dd)
               <br>
            </label>
            <label>Color:
               <input type="color" autofocus=""> 
                  (Hexadecimal code such as #ADD8E6)
            </label>
            <br>
            <label>Email:
               <input type="email" placeholder="name@domain.com" required=""> (name@domain.com)
            </label>
            <br>
            <label>Number:
               <input type="number" min="0" max="7" step="1" value="4">
            </label> (Enter a number between 0 and 7)
            <br>
            <label>Range:
               0 <input type="range" min="0" max="20" value="10"> 20
            </label>
            <br>
            <label>Search:
               <input type="search" placeholder="search query">
            </label> (Enter your search query here.)
            <br>
               <label>Tel:
                  <input type="tel" placeholder="(###) ###-####" pattern="\(\d{3}\)\d{3}-\d{4}" required=""> 
                     (###) ###-####
               </label>
            </b>
         <p>
          <input type="submit" value="Submit Form" />
          <input type="reset" value="Clear Form" />
        </p>
      </fieldset>
      </form>
    </div>
  </body>
</html>
