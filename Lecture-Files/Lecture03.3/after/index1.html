<html>
  <head>
    <title>HTML Forms</title>
  </head>

  <body>
    <div>
      <header>
        <img
          alt="York logo"
          height="100"
          src="YorkU.png"
          width="300" /><br /><br /><br />
        <h1>York Universiry - Registration Form</h1>
      </header>
      <main>
        <form action="mailto:jdoe@registration.yorku.ca" method="post">
          <table>
            <tbody>
              <tr>
                <td>First Name:</td>
                <td>
                  <input
                    type="text"
                    name="txtFirstN"
                    id="txtFirstN"
                    size="25"
                    tabindex="1" />
                </td>
              </tr>
              <tr>
                <td>Last Name:</td>
                <td>
                  <input
                    type="text"
                    name="txtLastN"
                    id="txtLastN"
                    size="25"
                    tabindex="2" />
                </td>
              </tr>
              <tr>
                <td>Email:</td>
                <td>
                  <input
                    type="text"
                    name="txtEmail"
                    id="txtEmail"
                    size="35"
                    tabindex="3" />
                </td>
              </tr>
              <tr>
                <td>Create Pwd:</td>
                <td>
                  <input
                    type="password"
                    name="txtPwd"
                    id="txtPwd"
                    size="15"
                    maxlength="8"
                    tabindex="4" />
                </td>
              </tr>
              <tr>
                <td>Confirm Pwd:</td>
                <td>
                  <input
                    type="password"
                    name="txtConPwd"
                    id="txtConPwd"
                    size="15"
                    maxlength="8"
                    tabindex="5" />
                </td>
              </tr>
              <tr>
                <td>Gender:</td>
                <td>
                  <input
                    type="radio"
                    name="optGender"
                    id="optGender1"
                    value="M"
                    tabindex="6" />Male
                  <input
                    type="radio"
                    name="optGender"
                    id="optGender2"
                    value="F"
                    tabindex="7" />Female
                  <input
                    type="radio"
                    name="optGender"
                    id="optGender3"
                    value="O"
                    tabindex="8" />Other <input type="text" />
                </td>
              </tr>
              <tr>
                <td>Last Degree:</td>
                <td>
                  <input
                    type="radio"
                    name="optEducation"
                    id="optEducation1"
                    value="Sec"
                    tabindex="8" />Secondary
                  <input
                    type="radio"
                    name="optEducation"
                    id="optEducation2"
                    value="Col"
                    tabindex="9" />College
                  <input
                    type="radio"
                    name="optEducation"
                    id="optEducation3"
                    value="Ugrad"
                    tabindex="10" />UnderGrad
                  <input
                    type="radio"
                    name="optEducation"
                    id="optEducation4"
                    value="Grad"
                    tabindex="11" />Graduate
                </td>
              </tr>
              <tr>
                <td>Interests:</td>
                <td>
                  <input
                    type="checkbox"
                    name="chkClC"
                    id="chkClC"
                    value="ClC"
                    tabindex="13" />Cloud Computing
                  <input
                    type="checkbox"
                    name="chkDSc"
                    id="chkDSc"
                    value="DSc"
                    tabindex="13" />Data Science
                  <input
                    type="checkbox"
                    name="chkCy"
                    id="chkCy"
                    value="Cy"
                    tabindex="13" />Cybersecurity
                </td>
              </tr>
              <tr>
                <td>Select Courses:</td>
                <td>
                  <select name="lstCourses" size="4" tabindex="14">
                    <option value="EECS1012">
                      Intro. to Computing: A Net-centric Approach
                    </option>
                    <option value="EECS1015">
                      Intro. to Computer Science and Programming
                    </option>
                    <option value="EECS1022">
                      Intro. to Object Oriented Programming
                    </option>
                    <option value="EECS2030">
                      Advanced Object Oriented Programming
                    </option>
                    <option value="EECS2031">Software Tools</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td>Accommodation Requests:</td>
                <td>
                  <textarea
                    name="txtSpecialReq"
                    cols="50"
                    rows="7"
                    tabindex="15">
---Describe any accommodation needed for the Accessibility Office to contact you
					</textarea
                  >
                </td>
              </tr>
              <tr>
                <td>
                  <input
                    type="submit"
                    name="btnSubmit"
                    value="Register"
                    tabindex="16" />
                </td>
                <td>
                  <input
                    type="reset"
                    name="btnReset"
                    value="Cancel"
                    tabindex="17" />
                </td>
              </tr>
            </tbody>
          </table>
        </form>
      </main>
      <footer>
        <p id="copyright">©&nbsp;Copyright HTML Forms - DIGT1302</p>
      </footer>
    </div>
  </body>
</html>
