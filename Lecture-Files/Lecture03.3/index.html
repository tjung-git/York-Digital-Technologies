<html>
  <head>
    <title>HTML Forms</title>
  </head>

  <body>
    <div>
      <header>
        <img
          alt="York logo"
          height="100"
          src="YorkU.png"
          width="300" /><br /><br /><br />
        <h1>York Universiry - Registration Form</h1>
      </header>
      <main>
        <form action="mailto:jdoe@registration.yorku.ca" method="post">
          First Name:
          <input type="text" name="txtFirst" id="txtFirst" size="25" tabindex="1">
          <br>
          Last Name: <input type="text" name="txtLast" id="txtLast" size="25" tabindex="2">
          <br />

          Email:

          <input
            type="text"
            name="txtEmail"
            id="txtEmail"
            size="35"
            tabindex="3" />

          <br />

          Create Pwd:

          <input
            type="password"
            name="txtPwd"
            id="txtPwd"
            size="15"
            maxlength="8"
            tabindex="4" />

          <br />

          Confirm Pwd:

          <input
            type="password"
            name="txtConPwd"
            id="txtConPwd"
            size="15"
            maxlength="8"
            tabindex="5" />

          <br />
        Last Degree:
        <input type="radio"
          name="optEducation"
          id="optEducation1"
          value="Sec"> Secondary
          <input
            type="radio"
            name="optEducation"
            id="optEducation2"
            value="Col"
            tabindex="9" />College
          <input
            type="radio"
            name="optEducation"
            id="optEducation3"
            value="Ugrad"
            tabindex="10" />UnderGrad
          <input
            type="radio"
            name="optEducation"
            id="optEducation4"
            value="Grad"
            tabindex="11" />Graduate

          <br />
          Interests:
          <input type="checkbox"
            name="chkClC"
            id="chkClC"
            value="Clc"> Cloud Computing
            <input
            type="checkbox"
            name="chkDSc"
            id="chkDSc"
            value="DSc"
            tabindex="13" />Data Science
          <input
            type="checkbox"
            name="chkCy"
            id="chkCy"
            value="Cy"
            tabindex="13" />Cybersecurity

          <br />
          Select Courses:
          <select name="lstCourses" size="4">

            <option value="EECS1012">Intro. Computing: A net centric Approach</option>
            <option value="EECS1015">
              Intro. to Computer Science and Programming
            </option>
            <option value="EECS1022">
              Intro. to Object Oriented Programming
            </option>
            <option value="EECS2030">
              Advanced Object Oriented Programming
            </option>
            <option value="EECS2031">Software Tools</option>
          </select>
          <br>
          Accomodation Requests:
          <textarea name="txtReq" cols="50" rows="7">
---Describe any accommodation needed for the Accessibility Office to contact you      
          </textarea>
          <br>
          <input type="submit" name="btnSubmit" value="Register">
          <input type="reset" name="btnreset" value="Cancel">
        </form>

      </main>
      <footer>
        <p id="copyright">©&nbsp;Copyright HTML Forms - DIGT1302</p>
      </footer>
    </div>
  </body>
</html>
